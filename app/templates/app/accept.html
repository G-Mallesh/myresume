<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Generatort</title>
      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <div class="row">
        <div class="col-md-12">
            <h1>CV Generator</h1>
            <h1></h1>
        </div>
    </div>
     <div class="row">
        <div class="col-md-12">
            <h1>Please Fill Out The Details</h1>
            <h1></h1>
        </div>
    </div>
     <div class="row">
        <div class="col-md-7">
            <form method="POST">
                {% csrf_token %}
                <label for="" class="ms-3">Name</label>
                <input type="text" class="form-control ms-3 mt-2" name="name">
          
            <label for="" class="ms-3">Email</label>
                <input type="email" class="form-control ms-3 mt-2" name="email">
            
            <label for="" class="ms-3">Mobile</label>
                <input type="tel" class="form-control ms-3 mt-2" name="mobile">
         
            <label for="" class="ms-3">About</label>
                <input type="text" class="form-control ms-3 mt-2" name="about">
           
            <label for="" class="ms-3">Degree</label>
                <input type="text" class="form-control ms-3 mt-2" name="degree">
           
            <label for="" class="ms-3">University</label>
                <input type="text" class="form-control ms-3 mt-2" name="university">
        
            <label for="" class="ms-3">School</label>
                <input type="text" class="form-control ms-3 mt-2" name="school">
            <label for="" class="ms-3">previous Work</label>

                <input type="text" class="form-control ms-3 mt-2" name="previous_work">
            <label for="" class="ms-3">Skills</label>

                <input type="text" class="form-control ms-3 mt-2" name="skills">

                <button type="submit" class="btn btn-primary m-3">Submit</button>
            </form>

        </div>
    </div>
</body>
</html>
